services:
  # Backend Service (FastAPI with smolagents)
  - type: web
    name: voice-agent-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r voice-agent-app/backend/requirements.txt
    startCommand: cd voice-agent-app/backend && bash render_start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PORT
        fromService:
          type: web
          name: voice-agent-backend
          property: port
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: http://localhost:3006,https://voice-agent-frontend.onrender.com
      - key: SONIOX_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: VOGENT_API_KEY
        sync: false
      - key: VOGENT_VOICE_ID
        sync: false
    healthCheckPath: /health
    autoDeploy: true

  # Frontend Service (Next.js)
  - type: web
    name: voice-agent-frontend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd voice-agent-app/voice-agent && npm install && npm run build
    startCommand: cd voice-agent-app/voice-agent && npm run start
    envVars:
      - key: NODE_VERSION
        value: "18.17.0"
      - key: PORT
        fromService:
          type: web
          name: voice-agent-frontend
          property: port
      - key: NEXT_PUBLIC_API_URL
        value: https://voice-agent-backend.onrender.com
    autoDeploy: true
